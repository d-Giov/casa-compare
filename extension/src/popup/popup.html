<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CasaCompare</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 360px;
      min-height: 200px;
      background: #f8fafc;
      color: #1e293b;
    }

    .header {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 { font-size: 16px; font-weight: 700; }
    .header .logo { font-size: 20px; }

    .content { padding: 16px; }

    .state-auth, .state-not-property, .state-loading, .state-saved {
      text-align: center;
      padding: 24px 16px;
      color: #64748b;
    }

    .state-auth h2 { font-size: 14px; color: #1e293b; margin-bottom: 8px; }
    .state-auth p { font-size: 12px; margin-bottom: 14px; }

    .property-card { background: white; border-radius: 10px; padding: 14px; border: 1px solid #e2e8f0; }
    .property-img {
      width: 100%; height: 120px; object-fit: cover;
      border-radius: 6px; margin-bottom: 12px;
      background: #e2e8f0;
    }
    .property-title { font-size: 13px; font-weight: 600; color: #1e293b; margin-bottom: 4px; line-height: 1.4; }
    .property-address { font-size: 11px; color: #64748b; margin-bottom: 10px; }
    .property-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .meta-chip {
      background: #f1f5f9; border-radius: 20px;
      padding: 3px 10px; font-size: 11px; color: #475569; font-weight: 500;
    }
    .price { font-size: 18px; font-weight: 700; color: #2563eb; margin-bottom: 12px; }

    .btn {
      width: 100%; padding: 10px; border-radius: 8px; border: none;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;
    }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }
    .btn-secondary { background: #f1f5f9; color: #1e293b; margin-top: 8px; }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-link { background: none; color: #2563eb; text-decoration: underline; font-size: 12px; margin-top: 4px; }

    .source-badge {
      display: inline-block; font-size: 10px; font-weight: 700;
      background: #dbeafe; color: #1d4ed8; border-radius: 4px;
      padding: 1px 6px; margin-bottom: 8px;
      text-transform: uppercase;
    }

    .agency { font-size: 11px; color: #64748b; margin-bottom: 12px; }
    .agency span { font-weight: 600; color: #475569; }

    .status-msg { font-size: 11px; margin-top: 8px; text-align: center; }
    .status-msg.success { color: #16a34a; }
    .status-msg.error { color: #dc2626; }

    .spinner {
      width: 24px; height: 24px; border: 3px solid #e2e8f0;
      border-top-color: #2563eb; border-radius: 50%;
      animation: spin .8s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .not-detected {
      padding: 20px 16px; text-align: center;
    }
    .not-detected .icon { font-size: 32px; margin-bottom: 8px; }
    .not-detected p { font-size: 12px; color: #64748b; }

    .saved-icon { font-size: 36px; margin-bottom: 8px; }
    .saved-msg { font-size: 14px; font-weight: 600; color: #16a34a; margin-bottom: 4px; }

    #openWebapp {
      position: absolute; right: 12px; top: 12px;
      background: rgba(255,255,255,.2); border: none; color: white;
      border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer;
    }
    #openWebapp:hover { background: rgba(255,255,255,.3); }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🏠</span>
    <h1>CasaCompare</h1>
    <button id="openWebapp">Apri app ↗</button>
  </div>

  <div class="content" id="content">
    <div class="state-loading">
      <div class="spinner"></div>
      <p>Analizzando la pagina...</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
